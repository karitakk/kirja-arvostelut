<!DOCTYPE html>
<html>
<head>
  <title>Uusi arviointi</title>
</head>
<body>
  <h1>Lisää uusi kirja-arviointi</h1>  

  <form action="/new_item" method="post">

    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">

    <p>
      Otsikko: <br />
      <input type="text" name="title" required/>
    </p>

    <p>
      Kirjailija: <br />
      <input type="text" name="author" required/>
    </p>

    <p>
      Arviointi (1–5): <br />
      <input type="number" name="review" min="1" max="5" step="1" required>
    </p>

    <p>Valitse luokat:</p>
    {% for category in categories %}
      <input type="checkbox" name="categories" value="{{ category.id }}">
      {{ category.name }}<br>
    {% endfor %}

    <input type="submit" value="Luo arviointi" />
  </form>
</body>
</html>
